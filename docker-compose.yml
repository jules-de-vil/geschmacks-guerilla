version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: guerilla_db
    restart: always
    environment:
      POSTGRES_USER: guerilla
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: recipes_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: